<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendario Basketpiù 2026/27</title>
<style>:root{font-family:system-ui,Arial,sans-serif;color:#15243a;background:#f3f6fb}body{margin:0}header{background:#12366b;color:white;padding:22px 16px}header h1{margin:0;font-size:1.55rem}header p{margin:5px 0 0;color:#dce7fa}main{max-width:1100px;margin:auto;padding:16px}.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:16px 0}input,select{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:9px;background:white;padding:12px;font-size:1rem}.meta{margin:12px 0;color:#42536d}.table-wrap{overflow:auto;border-radius:12px;background:white;box-shadow:0 2px 10px #14284a12}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e5eaf2;font-size:.91rem}th{background:#e7eef8;position:sticky;top:0}tr:hover{background:#f7faff}.empty{text-align:center;padding:24px}.home{font-weight:650}@media(max-width:650px){header{padding:18px 14px}main{padding:12px}.table-wrap{overflow:visible;background:transparent;box-shadow:none}table{min-width:0}thead{display:none}tbody{display:grid;gap:12px}tr{display:block;background:white;border-radius:12px;padding:12px;box-shadow:0 2px 10px #14284a12}td{display:flex;justify-content:space-between;gap:14px;border:0;padding:5px 0;text-align:right;overflow-wrap:anywhere}td:before{content:attr(data-label);font-weight:650;text-align:left;flex:0 0 85px;color:#52627a}.empty{display:block;text-align:center}}</style></head>
<body><header><h1>🏀 Calendario Basketpiù</h1><p>Stagione sportiva 2026–2027 · Calendario generale</p></header><main><div class="filters"><select id="sport">
<option value="">Tutti gli sport</option>
<option value="basket">Basket</option>
<option value="pallavolo">Pallavolo</option></select><input id="date" type="date" aria-label="Filtra per data"><select id="champ"><option value="">Tutti i campionati</option></select><select id="gym"><option value="">Tutte le palestre</option></select><input id="search" type="search" placeholder="Cerca squadra, palestra, arbitro…" aria-label="Ricerca libera"></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0"><button type="button" onclick="vistaPartite='future';els.date.value=new Date().toLocaleDateString('sv-SE');render()">Prossime partite</button><button type="button" onclick="vistaPartite='passate';els.date.value='';render()">Partite precedenti</button><button type="button" onclick="vistaPartite='tutte';els.date.value='';render()">Tutte le partite</button></div><p class="meta" id="status">Caricamento partite…</p><div class="table-wrap"><table><thead><tr><th>Codice gara</th><th>Data</th><th>Ora</th><th>Campionato</th><th>Casa</th><th>Ospiti</th><th>Palestra</th><th>Arbitri</th></tr></thead><tbody id="games"></tbody></table></div></main>
<script>
const els={sport:document.getElementById('sport'),search:document.getElementById('search'),date:document.getElementById('date'),champ:document.getElementById('champ'),gym:document.getElementById('gym'),referee:document.getElementById('referee'),games:document.getElementById('games'),status:document.getElementById('status')};let all=[];let vistaPartite='future';els.date.value=new Date().toLocaleDateString('sv-SE');
function clean(x){return String(x??'').trim()}
function dateLabel(s){if(!s)return '—';const p=s.split('/');const d=new Date(p.length===3?`${p[2]}-${p[1]}-${p[0]}T12:00:00`:s+'T12:00:00');return Number.isNaN(d.getTime())?s:new Intl.DateTimeFormat('it-IT',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}).format(d)}function addCell(tr,label,value,cls){const td=document.createElement('td');td.dataset.label=label;td.textContent=clean(value)||'—';if(cls)td.className=cls;tr.appendChild(td)}
function fillSelect(el,values){el.length = 1;for(const v of [...new Set(values.map(clean).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it'))){const o=document.createElement('option');o.value=v;o.textContent=v;el.appendChild(o)}}
function render(){const q=els.search.value.toLocaleLowerCase('it');const filtered=all.filter(g=>(!els.sport.value || (els.sport.value === 'basket') === /basket|più|azzurra/i.test([g.casa,g.ospiti].join(' '))) &&(vistaPartite==='tutte'||(vistaPartite==='future'?g.data.split('/').reverse().join('-')>=new Date().toLocaleDateString('sv-SE'):g.data.split('/').reverse().join('-')<new Date().toLocaleDateString('sv-SE')))&&(!els.date.value||els.date.value===new Date().toLocaleDateString('sv-SE')||g.data.split('/').reverse().join('-')===els.date.value)&&(!els.champ.value||g.campionato===els.champ.value)&&(!els.gym.value||g.palestra===els.gym.value)&&(!q||[g.data,g.ora,g.campionato,g.casa,g.ospiti,g.palestra,g.arbitri,g.numero].some(v=>clean(v).toLocaleLowerCase('it').includes(q))));els.games.replaceChildren();for(const g of filtered){const tr=document.createElement('tr');addCell(tr,'Codice gara',g.numero);addCell(tr,'Data',dateLabel(g.data));addCell(tr,'Ora',g.ora);addCell(tr,'Campionato',g.campionato);addCell(tr,'Casa',g.casa,'home');addCell(tr,'Ospiti',g.ospiti);addCell(tr,'Palestra',g.palestra);addCell(tr,'Arbitri',g.arbitri);els.games.appendChild(tr)}if(!filtered.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=8;td.className='empty';td.textContent='Nessuna partita trovata.';tr.appendChild(td);els.games.appendChild(tr)}els.status.textContent=`${filtered.length} partite visualizzate su ${all.length}`}
for(const el of [els.sport,els.search,els.date,els.champ,els.gym]el.addEventListener('input',render);
  const DATI_BASKETPIU =
  "https://script.google.com/macros/s/AKfycbzmHpei9HWeYuKa1C-AXwF6I_i47K5qM83dZLgB20UkEK5XmaWmdY58M0ukc2nrFQI/exec";

function caricaPartiteBasketpiu() {
  return new Promise((resolve, reject) => {
    const nome = "basketpiuCallback";
    const script = document.createElement("script");

    const timeout = setTimeout(() => {
      pulisci();
      reject(new Error("Tempo di caricamento scaduto"));
    }, 30000);

    function pulisci() {
      clearTimeout(timeout);
      script.remove();
      delete window[nome];
    }

    window[nome] = dati => {
      pulisci();
      if (!dati.successo) {
        reject(new Error("Errore nel calendario"));
        return;
      }

      resolve((dati.partite || []).map(p => ({
        ...p,
        arbitri: p.arbitro || "Da assegnare"
      })));
    };

    script.onerror = () => {
      pulisci();
      reject(new Error("Collegamento non riuscito"));
    };

    script.src =
      DATI_BASKETPIU +
      "?callback=" + nome +
      "&t=" + Date.now();

    document.head.appendChild(script);
  });
}
caricaPartiteBasketpiu().then(data=>{all=(Array.isArray(data)?data:[]).map(g=>({numero:clean(g.numero).replace(/\.0$/, ''),data:clean(g.data),ora:clean(g.ora),campionato:clean(g.campionato),casa:clean(g.casa),ospiti:clean(g.ospite),palestra:clean(g.palestra),arbitri:clean(g.arbitro)})).filter(g=>g.data&&(g.casa||g.ospiti||g.campionato));all.sort((a,b)=>{
  const converti = p => {
    const [giorno,mese,anno] = p.data.split('/');
    return `${anno}-${mese}-${giorno} ${p.ora}`;
  };
  return converti(a).localeCompare(converti(b));
});fillSelect(els.champ,all.filter(g=>!els.sport.value||(els.sport.value==='basket')===/basket|più|azzurra/i.test([g.casa,g.ospiti].join(' '))).map(g=>g.campionato));fillSelect(els.gym,all.map(g=>g.palestra));render()}).catch(()=>{els.status.textContent='Il calendario è pronto. Manca ancora il collegamento ai dati aggiornati.';els.games.innerHTML='<tr><td class="empty" colspan="7">Le partite compariranno dopo la configurazione della sincronizzazione.</td></tr>'});
els.sport.addEventListener('change', () => {
  els.champ.value = '';
  fillSelect(els.champ, all.filter(g =>
    (!els.sport.value || (els.sport.value === 'basket') ===
    /basket|più|azzurra/i.test([g.casa, g.ospiti].join(' '))
  )).map(g => g.campionato));
  render();
});</script></body></html>
